# dsh-galfree bundle patch: inserts the dual-face plugin row into the web
# profile roster. The node half (exports ".") runs in the host process
# (project service seam, /api/galfree routes, agent tools), and the
# `dsh.client` declaration in package.json loads the browser half
# (exports "./client", served at /plugins/dsh-galfree/client.js) in the GUI.
#
# 第二行是「Galgame 制作」这个 agent preset 本身 —— 它**随插件包一起走**:
# 装了 dsh-galfree 这个 bundle,preset 就在名单里,没有"再拷四个文件到
# ~/.dsh/.agent-presets/"那一步。为什么能这样、以前为什么不能,写在下面。
- insert:
    # ── 插件本体 ────────────────────────────────────────────────────────────
    - id: galfree
      name: 'dsh-galfree'

    # ── 「Galgame 制作」preset ───────────────────────────────────────────────
    #
    # 为什么是一行声明:0.1.7 起 preset 不再是 `$DSH_HOME/.agent-presets/<id>/` 那个目录
    # ——用户 preset 目录机制被删掉了,**没有任何东西再读它**(`@deepseek-ai/dsh-agent-preset`
    # 的 `skills/editing-cordis-compositions/SKILL.md` 明写 "Nothing reads that directory
    # any more";registry 那一侧 `@deepseek-ai/dsh-agent-preset-registry/README.md` 也写明
    # 它"neither scans directories nor accepts preset paths")。现在一个 preset =
    # 一行 `@deepseek-ai/dsh-agent-preset` 声明,`config.plugins` 就是它的组装;随包交付的
    # 例子是 `@deepseek-ai/dsh-web-app` 的 `presets/standard.patch.yml`(它自己
    # `dsh.bundle.patch` 的一层)。
    #
    # 为什么这一行放在**插件的 bundle patch** 里而不是 profile 的 `cordis.patch.yml`:
    # bundle patch 是随包走的 —— 谁装了 dsh-galfree,谁就同时得到插件与这个 preset,
    # 于是"preset 要求插件在场"这件事变成**结构上成立**,而不是靠人记得多拷一步。
    # 这也顺手干掉了旧的两种装法(A 插件装部署 / B 插件交给 preset 授予)那个二选一:
    # 不再需要把 `dsh-galfree` 再声明进 preset —— 它在**同一个 patch 的上一行**,重复注册
    # 设置命名空间与 `/api/galfree/*` 路由("重复即抛")的老坑不会再有。
    #
    # 行 id `preset-galgame` 是 Loader 用来定位这一行做编辑的地址;会话真正保存的 preset
    # 身份是 `config.id`(=`galgame`),两处别混(`@deepseek-ai/dsh-agent-preset/README.md`:
    # "The declaration row's id addresses Loader edits; config.id is the preset identity
    # saved by sessions")。
    #
    # `name` / `description` / `order` 抄自 `presets/galgame/preset.yml`(那份文件现在**只**
    # 是这一行的元数据来源,宿主不读它),`src/preset.test.ts` 把三者与它钉在一起。
    #
    # `plugins` = `presets/galgame/agent.cordis.yml`(给人读的那一份,逐行同内容)+
    # **两处声明的改动**:persona 立场、末尾的 `galfree-guard`。测试逐行深度比对,
    # 所以这份长列表不是"另抄一遍",而是同一个真相的交付形态。
    - id: preset-galgame
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: galgame
        name: Galgame 制作
        description: 用 GALFree 做一部 Ren'Py galgame 的专用模式：设定集 → 请人盖定稿戳 → 逐场生成 → 素材 → 音频 → 试玩 → 发布。需要已装 GALFree 插件（工具面与流程指引由它提供）。
        order: 5
        plugins:
          # ── identity:这个模式的立场 ──────────────────────────────────────
          #
          # 只写"stance":流程顺序 / 闸门 / 完成判据**不在 persona 里复述** —— 那些由 GALFree
          # 插件注入系统提示的 `galfree-workflow` 段(与接缝同源;改接缝它自动跟着变,写在这里
          # 就会分叉)。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: >-
                You are a galgame production agent powered by the {{model}} model. 你在制作一部 Ren'Py
                galgame,用 GALFree 工作台把它从一句主题做到能发布的成品。

                按系统提示里的 GALFree 流程指引(`galfree-workflow` 段)做:顺序、每一步的闸门、
                完成判据、以及哪些必须请人,都在那一段里 —— 不要凭记忆复述,也不要另推一套。

                动手前先 `galfree_project_status` 读一次板,并按返回的 `nextActions` 认领活:
                `actor: agent` 的自己做完,`actor: human` 的(盖审读戳、认可、发布拍板)说清要人做什么、
                为什么,然后**等**。描述现状时只讲板上与工具返回的事实:校验不过就说不过,产物没出来就说没出来。

                一次只推进一环:上一环没过,下一环的产物不算数(没定稿的设定集生成出来的戏、
                没素材的戏试玩出来的界面,都不算数)。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ─────────────────────────────────────────────────────────
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ────────────────────────────────────────────────────
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ───────────────────────────────────────────────
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills ────────────────────────────────────────────────────────
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals ─────────────────────────────────────────────────────────
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ─────────────────────────────────────────────────────
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                        The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                        Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                        Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                        When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── compaction ────────────────────────────────────────────────────
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ──────────────────────────────────────
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              # 这两个 provider 生产环境不装;装了对应的 Bundle 再启用(与 standard 一致)。
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              # 0.1.7 的 standard 里这一行叫 `workflow-ptc` / `@deepseek-ai/dsh-workflow-ptc`
              # (0.1.5 时叫 workflow-worker-thread);跟着宿主走,别按记忆写。
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              # 0.1.7 起 standard 把 ralph 默认关掉了(`disabled: true`);我们照抄。
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── remaining model-facing rows ───────────────────────────────────
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: present
            name: '@deepseek-ai/dsh-tool-present'

          # 0.1.7 的 standard 末尾多这一行:插件管理工具默认不装(要它得在 profile 里显式打开)。
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true

          # ── 本模式的第二处改动:前置检查 ──────────────────────────────────
          #
          # 为什么点名 `dsh-galfree/guard`(裸包名 + package.json 的 exports 子路径)而不是
          # 相对路径:preset 的 `plugins` 行由 registry 挂载时,解析基准是**声明这一行的
          # Loader 树的 baseUrl** —— 这一行声明在 profile 的根 include
          # (`<profileDir>/cordis.yml`)里,所以基准是 **profile 目录**,不是插件包目录
          # (`dsh-app-boot` 的 `boot()` 把 root ctx 的 baseUrl 设成配置文件所在目录,
          # `Include` 的构造函数设成同一个目录;registry 的 `mountPreset` 用
          # `record.context.baseUrl` 建 preset 树)。本机 0.1.7-rc.2 实测(`agentPresets/list`
          # 的诊断):`./guard.mjs` → broken "never started";
          # `./node_modules/dsh-galfree/presets/galgame/guard.mjs` → 正常(基准是 profile 目录);
          # `dsh-galfree/guard` → 正常。文件仍在 `presets/galgame/guard.mjs`,靠 exports 露出。
          #
          # 也**不能**给这一行加 `disabled`:registry 挂载时的 `auditRows` 会跳过 disabled 行,
          # 那样就回到"静默少几个工具"了。guard 自己为什么要等一会儿再判工具在不在
          # (宿主行并行激活 + 本插件的工具走懒注入),机制与实测写在 guard.mjs 的文件头。
          - id: galfree-guard
            name: 'dsh-galfree/guard'
